    <!-- PWA Service Worker handling (Disabled in localhost/dev, fully managed in production) -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister stale SW in dev mode for clean Vite HMR
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(names => {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }
        } else {
          // Production SW registration and push subscription request
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
              console.log('[PWA] Service Worker registrado com sucesso: ', reg.scope);
              
              // Detect updates
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker == null) return;
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      console.log('[PWA] Nova versão instalada. Recarregando aplicativo...');
                      window.location.reload();
                    } else {
                      console.log('[PWA] Conteúdo em cache para uso offline!');
                    }
                  }
                };
              };

              // Request Push Permission
              if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(() => {
                  Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                      console.log('[PWA] Permissão de Push Notifications concedida.');
                    }
                  });
                }, 10000); // Exibe aviso após 10s para não atrapalhar o carregamento inicial
              }
            }).catch(err => {
              console.error('[PWA] Erro ao registrar Service Worker:', err);
            });
          });
        }
      }
    </script>
