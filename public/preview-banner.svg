<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Background Cyan/Aqua Teal Gradient -->
    <linearGradient id="bgAqua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41d8e0" />
      <stop offset="50%" stop-color="#21c2cc" />
      <stop offset="100%" stop-color="#19abb4" />
    </linearGradient>

    <!-- Text Iris Blue Gradient -->
    <linearGradient id="irisBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#0369a1" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Eye Iris Inner Sphere Gradient -->
    <radialGradient id="eyeIrisCenter" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Eye Outer Ring Gradient -->
    <linearGradient id="eyeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="eyeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" fill="url(#bgAqua)" />

  <!-- Subtle Vignette & Light Flares -->
  <circle cx="200" cy="100" r="300" fill="#ffffff" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1000" cy="400" r="350" fill="#0284c7" opacity="0.08" filter="url(#softGlow)" />

  <!-- BRAND LOGO CONTAINER -->
  <g transform="translate(100, 110)" filter="url(#eyeShadow)">
    
    <!-- Text: "Íris" -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="180" fill="url(#irisBlueGrad)" letter-spacing="-3">Íris</text>

    <!-- Stylized Eye forming the letter 'C' -->
    <g transform="translate(370, 0)">
      <!-- Outer Eye Shape (The 'C') -->
      <path d="M 190 20 C 100 20, 20 70, 0 100 C 20 130, 100 180, 190 180 C 130 160, 60 125, 60 100 C 60 75, 130 40, 190 20 Z" fill="url(#eyeRingGrad)" />
      
      <!-- Horizontal Iris Grid Lines inside the Eye C -->
      <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
        <line x1="70" y1="60" x2="160" y2="60" />
        <line x1="62" y1="80" x2="175" y2="80" />
        <line x1="60" y1="100" x2="180" y2="100" />
        <line x1="62" y1="120" x2="175" y2="120" />
        <line x1="70" y1="140" x2="160" y2="140" />
      </g>

      <!-- Center Iris Globe / Pupil -->
      <ellipse cx="120" cy="100" rx="36" ry="48" fill="url(#eyeIrisCenter)" stroke="#ffffff" stroke-width="3" />
      <ellipse cx="112" cy="88" rx="10" ry="14" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Text: "lin" -->
    <text x="575" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="180" fill="#1e3a8a" letter-spacing="-3">lin</text>

    <!-- Subtitle Text: "SISTEMA WEB" -->
    <text x="500" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="92" fill="#2d3748" letter-spacing="4">SISTEMA WEB</text>

  </g>
</svg>
